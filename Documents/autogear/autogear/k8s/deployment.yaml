
apiVersion: apps/v1
kind: Deployment
metadata:
  name: autogear
spec:
  replicas: 2
  selector:
    matchLabels:
      app: autogear
  template:
    metadata:
      labels:
        app: autogear
    spec:
      containers:
        - name: autogear-web
          image: autogear:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "128Mi"
